name: Unpack Tanzania hydrography dataset

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and unpack dataset
        shell: bash
        run: |
          cat .upload/part_* > /tmp/dataset.b64
          base64 --decode /tmp/dataset.b64 > /tmp/Tanzania_Lakes_Rivers_Shapefile.zip
          unzip -o /tmp/Tanzania_Lakes_Rivers_Shapefile.zip -d .
          cp /tmp/Tanzania_Lakes_Rivers_Shapefile.zip Tanzania_Lakes_Rivers_Shapefile.zip
          rm -rf .upload

      - name: Commit unpacked shapefiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Tanzania lakes and rivers shapefiles"
          git push
